<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SploitHen 14.02</title>
    <style>
      :root {
        --bg: #050b16;
        --panel: #08172a;
        --sunk: #071426;
        --line: #123b66;
        --fg: #c9e4ff;
        --bright: #eff8ff;
        --dim: #78a9d8;
        --faint: #47749f;
        --ok: #39bfff;
        --bad: #ff788e;
        --warn: #ffd166;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #0b1e36, #071426);
        text-align: center;
        box-shadow: 0 5px 24px rgba(0, 119, 255, 0.12);
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-shadow: 0 0 12px rgba(40, 170, 255, 0.55);
      }
      #brand b span { color: #38b6ff; }
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: #28aaff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 0 22px rgba(24, 145, 255, 0.12), inset 0 0 22px rgba(24, 145, 255, 0.035);
        background: linear-gradient(145deg, #071426, #091c33);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #69c5ff;
      }
    </style>
  </head>
  <body>
    <div id="brand"><b>SPLOITHEN <span>14.02</span></b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">SPLOITHEN 14.02 · ITS SPLOITED</p>
    <script type="module">
      import "./jb-g.js?v=hen184-1402-v3";
    </script>
  </body>
</html>
